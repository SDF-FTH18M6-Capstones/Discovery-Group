# Runs on every push and pull request. Merging is blocked until both jobs pass
# (turn on branch protection for `main` and `development` in the repository settings).
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockpilot
          POSTGRES_PASSWORD: stockpilot
          POSTGRES_DB: stockpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockpilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://stockpilot:stockpilot@localhost:5432/stockpilot_test
      DATABASE_URL: postgresql+psycopg://stockpilot:stockpilot@localhost:5432/stockpilot_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Migrations build the same database as the models
        run: |
          PGPASSWORD=stockpilot psql -h localhost -U stockpilot -d stockpilot_test -c "CREATE DATABASE stockpilot_ci"
          flask --app wsgi db upgrade
          flask --app wsgi db check
          python seed.py
      - name: Tests with coverage (fails under 60%)
        run: pytest --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
