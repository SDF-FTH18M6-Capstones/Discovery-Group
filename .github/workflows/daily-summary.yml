name: Daily summary

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Ask StockPilot to email each business its day
        env:
          API_URL: ${{ secrets.STOCKPILOT_API_URL }}
          TASK_TOKEN: ${{ secrets.TASK_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 \
            -X POST "$API_URL/api/tasks/daily-summary" \
            -H "X-Task-Token: $TASK_TOKEN"
