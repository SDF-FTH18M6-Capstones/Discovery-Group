<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d3b33" />
    <meta
      name="description"
      content="StockPilot runs the till, the stockroom, purchase orders and company assets for a small business."
    />
    <link rel="icon" type="image/png" href="/stockpilot1.png" />
    <title>StockPilot</title>
    <script>
      // Apply the saved theme before the page paints, so dark mode never flashes white.
      try {
        const saved = localStorage.getItem("stockpilot.theme") || "system";
        const dark =
          saved === "dark" ||
          (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {
        /* storage blocked: stay light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
